    <polygon points="77,62 91,70 91,86 77,94 63,86 63,70"/>
    <polygon points="119,62 133,70 133,86 119,94 105,86 105,70"/>
    <polygon points="161,62 175,70 175,86 161,94 147,86 147,70"/>
    <polygon points="203,62 217,70 217,86 203,94 189,86 189,70"/>
    <polygon points="245,62 259,70 259,86 245,94 231,86 231,70"/>
    <polygon points="287,62 301,70 301,86 287,94 273,86 273,70"/>
    <polygon points="329,62 343,70 343,86 329,94 315,86 315,70"/>
    <polygon points="371,62 385,70 385,86 371,94 357,86 357,70"/>
    <polygon points="413,62 427,70 427,86 413,94 399,86 399,70"/>

    <!-- Row 3 -->
    <polygon points="56,102 70,110 70,126 56,134 42,126 42,110"/>
    <polygon points="98,102 112,110 112,126 98,134 84,126 84,110"/>
    <polygon points="140,102 154,110 154,126 140,134 126,126 126,110"/>
    <polygon points="182,102 196,110 196,126 182,134 168,126 168,110"/>
    <polygon points="224,102 238,110 238,126 224,134 210,126 210,110"/>
    <polygon points="266,102 280,110 280,126 266,134 252,126 252,110"/>
    <polygon points="308,102 322,110 322,126 308,134 294,126 294,110"/>
