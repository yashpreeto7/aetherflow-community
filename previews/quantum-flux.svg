<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="qf-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e0524" stop-opacity="1"/>
      <stop offset="50%" stop-color="#050817" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020309" stop-opacity="1"/>
    </radialGradient>
    <filter id="qf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="node-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cyber Void -->
  <rect width="100%" height="100%" fill="url(#qf-bg)"/>

  <!-- Atmospheric Energy Nebula Blooms -->
  <circle cx="150" cy="110" r="120" fill="#00f0ff" opacity="0.08" filter="url(#node-glow)"/>
  <circle cx="330" cy="160" r="130" fill="#b400ff" opacity="0.09" filter="url(#node-glow)"/>

  <!-- Quantum Pulse Shockwave Rings (Expanding energy ripples) -->
  <circle cx="240" cy="135" r="85" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.35" stroke-dasharray="8,6" filter="url(#qf-glow)"/>
  <circle cx="240" cy="135" r="145" fill="none" stroke="#b400ff" stroke-width="1.2" opacity="0.2" stroke-dasharray="12,8"/>

  <!-- Honeycomb Hexagonal Cybernetic Matrix (Radius: 28px) -->
  <!-- Base Inactive Hex Grid (Subtle Dark Cyan stroke) -->
  <g fill="none" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.2">
    <!-- Row 1 -->
    <polygon points="56,22 70,30 70,46 56,54 42,46 42,30"/>
    <polygon points="98,22 112,30 112,46 98,54 84,46 84,30"/>
    <polygon points="140,22 154,30 154,46 140,54 126,46 126,30"/>
    <polygon points="182,22 196,30 196,46 182,54 168,46 168,30"/>
    <polygon points="224,22 238,30 238,46 224,54 210,46 210,30"/>
    <polygon points="266,22 280,30 280,46 266,54 252,46 252,30"/>
    <polygon points="308,22 322,30 322,46 308,54 294,46 294,30"/>
    <polygon points="350,22 364,30 364,46 350,54 336,46 336,30"/>
    <polygon points="392,22 406,30 406,46 392,54 378,46 378,30"/>
    <polygon points="434,22 448,30 448,46 434,54 420,46 420,30"/>

    <!-- Row 2 (Shifted Y) -->
