    <polygon points="77,142 91,150 91,166 77,174 63,166 63,150"/>
    <polygon points="119,142 133,150 133,166 119,174 105,166 105,150"/>
    <polygon points="161,142 175,150 175,166 161,174 147,166 147,150"/>
    <polygon points="203,142 217,150 217,166 203,174 189,166 189,150"/>
    <polygon points="245,142 259,150 259,166 245,174 231,166 231,150"/>
    <polygon points="287,142 301,150 301,166 287,174 273,166 273,150"/>
    <polygon points="329,142 343,150 343,166 329,174 315,166 315,150"/>
    <polygon points="371,142 385,150 385,166 371,174 357,166 357,150"/>
    <polygon points="413,142 427,150 427,166 413,174 399,166 399,150"/>

    <!-- Row 5 -->
    <polygon points="56,182 70,190 70,206 56,214 42,206 42,190"/>
    <polygon points="98,182 112,190 112,206 98,214 84,206 84,190"/>
    <polygon points="140,182 154,190 154,206 140,214 126,206 126,190"/>
    <polygon points="182,182 196,190 196,206 182,214 168,206 168,190"/>
    <polygon points="224,182 238,190 238,206 224,214 210,206 210,190"/>
    <polygon points="266,182 280,190 280,206 266,214 252,206 252,190"/>
    <polygon points="308,182 322,190 322,206 308,214 294,206 294,190"/>
    <polygon points="350,182 364,190 364,206 350,214 336,206 336,190"/>
    <polygon points="392,182 406,190 406,206 392,214 378,206 378,190"/>
    <polygon points="434,182 448,190 448,206 434,214 420,206 420,190"/>
