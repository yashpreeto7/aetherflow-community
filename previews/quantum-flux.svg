  <!-- High-Energy Glowing Active Hexagons (Pulsing conduits & tiles) -->
  <!-- Neon Cyan Energized Cells -->
  <polygon points="224,102 238,110 238,126 224,134 210,126 210,110"
           fill="rgba(0, 240, 255, 0.22)" stroke="#00f0ff" stroke-width="2.5" filter="url(#qf-glow)"/>
  <polygon points="182,102 196,110 196,126 182,134 168,126 168,110"
           fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="2"/>
  <polygon points="203,62 217,70 217,86 203,94 189,86 189,70"
           fill="rgba(0, 240, 255, 0.18)" stroke="#00f0ff" stroke-width="2.2" filter="url(#qf-glow)"/>

  <!-- Neon Magenta Energized Cells -->
  <polygon points="245,62 259,70 259,86 245,94 231,86 231,70"
           fill="rgba(180, 0, 255, 0.2)" stroke="#b400ff" stroke-width="2.2" filter="url(#qf-glow)"/>
  <polygon points="266,102 280,110 280,126 266,134 252,126 252,110"
           fill="rgba(180, 0, 255, 0.25)" stroke="#b400ff" stroke-width="2.5" filter="url(#qf-glow)"/>
  <polygon points="245,142 259,150 259,166 245,174 231,166 231,150"
           fill="rgba(180, 0, 255, 0.16)" stroke="#b400ff" stroke-width="2"/>
  <polygon points="287,142 301,150 301,166 287,174 273,166 273,150"
           fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="2"/>

  <!-- Glowing Quantum Energy Nodes (Vertices) -->
  <g fill="#ffffff" filter="url(#qf-glow)">
    <circle cx="224" cy="102" r="3"/>
    <circle cx="238" cy="110" r="3.2"/>
    <circle cx="238" cy="126" r="3.2"/>
    <circle cx="224" cy="134" r="3"/>
    <circle cx="210" cy="126" r="3"/>
    <circle cx="210" cy="110" r="3"/>

    <circle cx="266" cy="102" r="3"/>
    <circle cx="280" cy="110" r="3"/>
    <circle cx="280" cy="126" r="3"/>
    <circle cx="266" cy="134" r="3"/>
  </g>

  <!-- Interactive Burst Sparks (Quantum Energy Particles) -->
  <g fill="#00f0ff" opacity="0.9" filter="url(#qf-glow)">
    <circle cx="215" cy="95" r="1.8"/>
    <circle cx="230" cy="118" r="1.5"/>
    <circle cx="175" cy="140" r="2"/>
    <circle cx="195" cy="55" r="1.6"/>
    <circle cx="310" cy="120" r="1.8"/>
  </g>
  <g fill="#b400ff" opacity="0.9" filter="url(#qf-glow)">
    <circle cx="255" cy="80" r="1.8"/>
    <circle cx="270" cy="145" r="2"/>
    <circle cx="240" cy="160" r="1.5"/>
    <circle cx="295" cy="100" r="1.7"/>
    <circle cx="320" cy="170" r="1.6"/>
  </g>
</svg>
