<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="forest-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02140e"/><stop offset="100%" stop-color="#000705"/>
    </linearGradient>
    <filter id="ff-glow"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#forest-bg)"/>
  <!-- Tree Silhouettes -->
  <g fill="#010a07">
    <path d="M 40 270 L 60 80 L 80 270 Z"/>
    <path d="M 140 270 L 155 110 L 170 270 Z"/>
    <path d="M 330 270 L 350 90 L 370 270 Z"/>
    <path d="M 420 270 L 435 60 L 450 270 Z"/>
  </g>
  <!-- Fireflies -->
  <g fill="#bef264" filter="url(#ff-glow)">
    <circle cx="110" cy="130" r="5"/><circle cx="220" cy="90" r="6"/><circle cx="280" cy="150" r="5.5"/>
    <circle cx="190" cy="200" r="4"/><circle cx="380" cy="130" r="5"/><circle cx="80" cy="210" r="4"/>
  </g>
</svg>