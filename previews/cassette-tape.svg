<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <rect width="100%" height="100%" fill="#10031c"/>
  <g transform="translate(100, 45)">
    <!-- Cassette Shell -->
    <rect x="0" y="0" width="280" height="180" rx="12" fill="#1e0836" stroke="#ec4899" stroke-width="2.5"/>
    <!-- Cassette Label -->
    <rect x="25" y="20" width="230" height="105" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="140" y="45" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AETHERFLOW // 80s SYNTH</text>
    <!-- Spool Windows -->
    <rect x="55" y="55" width="170" height="55" rx="20" fill="#090114"/>
    <!-- Left Cog Reel -->
    <circle cx="95" cy="82" r="18" fill="none" stroke="#ec4899" stroke-width="2.5"/>
    <circle cx="95" cy="82" r="8" fill="#ec4899"/>
    <!-- Right Cog Reel -->
    <circle cx="185" cy="82" r="18" fill="none" stroke="#ec4899" stroke-width="2.5"/>
    <circle cx="185" cy="82" r="8" fill="#ec4899"/>
    <!-- Tape Ribbon Track -->
    <path d="M 95 82 L 185 82" stroke="#701a75" stroke-width="6"/>
  </g>
</svg>