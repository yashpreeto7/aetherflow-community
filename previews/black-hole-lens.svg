<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="bh-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#14081c"/><stop offset="60%" stop-color="#08020d"/><stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="accretion-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ff0055" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7700aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="bh-glow"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bh-bg)"/>
  <!-- Gravitational warped background stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="60" cy="50" r="1.2"/><circle cx="120" cy="220" r="1"/><circle cx="420" cy="60" r="1.5"/><circle cx="390" cy="210" r="1"/>
  </g>
  <!-- Lensed Accretion Disk (Upper Arch) -->
  <ellipse cx="240" cy="135" rx="140" ry="60" fill="url(#accretion-grad)" filter="url(#bh-glow)"/>
  <!-- Lensed Secondary Vertical Ring -->
  <ellipse cx="240" cy="135" rx="75" ry="95" fill="none" stroke="#ff8800" stroke-width="6" opacity="0.7" filter="url(#bh-glow)"/>
  <!-- Event Horizon Sphere -->
  <circle cx="240" cy="135" r="48" fill="#000000"/>
  <!-- Thin Photon Ring -->
  <circle cx="240" cy="135" r="49" fill="none" stroke="#ffffff" stroke-width="1.8" filter="url(#bh-glow)"/>
  <!-- Foreground Accretion Disk Crossing -->
  <ellipse cx="240" cy="142" rx="130" ry="24" fill="none" stroke="#ffaa00" stroke-width="7" filter="url(#bh-glow)"/>
</svg>