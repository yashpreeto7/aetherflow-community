<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="synth-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="45%" stop-color="#24073d"/>
      <stop offset="65%" stop-color="#540d58"/>
      <stop offset="100%" stop-color="#ff2d78"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="40%" stop-color="#ff5400"/>
      <stop offset="100%" stop-color="#ff0078"/>
    </linearGradient>
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2d78" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b400ff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="synth-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="480" height="155" fill="url(#synth-sky)"/>

  <!-- Striped Neon 80s Sun -->
  <g filter="url(#synth-glow)">
    <circle cx="240" cy="120" r="52" fill="url(#sun-grad)"/>
    <!-- Horizontal Venetian Sun Cuts -->
    <rect x="180" y="102" width="120" height="3" fill="#1b0528"/>
    <rect x="180" y="111" width="120" height="4.5" fill="#200632"/>
    <rect x="180" y="122" width="120" height="6" fill="#2d083e"/>
    <rect x="180" y="135" width="120" height="8" fill="#39094c"/>
    <rect x="180" y="150" width="120" height="11" fill="#460b57"/>
  </g>

  <!-- Horizon Line with Laser Glow -->
  <line x1="0" y1="155" x2="480" y2="155" stroke="#ff2d78" stroke-width="2.5" filter="url(#synth-glow)"/>

  <!-- Perspective 3D Neon Grid Floor -->
  <rect x="0" y="155" width="480" height="115" fill="#080214"/>

  <!-- Converging Perspective Rays from Horizon Center (240, 155) -->
  <g stroke="url(#grid-fade)" stroke-width="1.3" opacity="0.85">
    <line x1="240" y1="155" x2="240" y2="270"/>
    <line x1="240" y1="155" x2="210" y2="270"/>
    <line x1="240" y1="155" x2="270" y2="270"/>
    <line x1="240" y1="155" x2="175" y2="270"/>
    <line x1="240" y1="155" x2="305" y2="270"/>
    <line x1="240" y1="155" x2="135" y2="270"/>
    <line x1="240" y1="155" x2="345" y2="270"/>
    <line x1="240" y1="155" x2="90" y2="270"/>
    <line x1="240" y1="155" x2="390" y2="270"/>
    <line x1="240" y1="155" x2="40" y2="270"/>
    <line x1="240" y1="155" x2="440" y2="270"/>
    <line x1="240" y1="155" x2="-20" y2="270"/>
    <line x1="240" y1="155" x2="500" y2="270"/>
    <line x1="240" y1="155" x2="-90" y2="270"/>
    <line x1="240" y1="155" x2="570" y2="270"/>
  </g>

  <!-- Horizontal Grid Scanlines with Perspective Depth Spacing -->
  <g stroke="#ff2d78" stroke-width="1.2" opacity="0.75">
    <line x1="0" y1="158" x2="480" y2="158" opacity="0.3"/>
    <line x1="0" y1="162" x2="480" y2="162" opacity="0.4"/>
    <line x1="0" y1="168" x2="480" y2="168" opacity="0.5"/>
    <line x1="0" y1="176" x2="480" y2="176" opacity="0.6"/>
    <line x1="0" y1="187" x2="480" y2="187" opacity="0.75"/>
    <line x1="0" y1="202" x2="480" y2="202" opacity="0.9"/>
    <line x1="0" y1="223" x2="480" y2="223"/>
    <line x1="0" y1="252" x2="480" y2="252" stroke-width="1.8"/>
  </g>
</svg>