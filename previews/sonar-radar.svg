<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="radar-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#02240b"/>
      <stop offset="65%" stop-color="#011205"/>
      <stop offset="100%" stop-color="#000702"/>
    </radialGradient>
    <filter id="radar-glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#radar-bg)"/>
  <!-- Circular Scope -->
  <g transform="translate(240, 135)" stroke="#00ff41" fill="none">
    <circle r="105" stroke-width="2.5"/>
    <circle r="80" stroke-width="1" stroke-dasharray="4,4" opacity="0.7"/>
    <circle r="55" stroke-width="1" opacity="0.5"/>
    <circle r="30" stroke-width="1" stroke-dasharray="2,2" opacity="0.4"/>
    <!-- Crosshairs -->
    <line x1="-105" y1="0" x2="105" y2="0" stroke-width="1" opacity="0.7"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke-width="1" opacity="0.7"/>
    <!-- Radar Sweep Wedge -->
    <path d="M 0 0 L 88 -58 A 105 105 0 0 0 35 -99 Z" fill="#00ff41" opacity="0.22"/>
    <line x1="0" y1="0" x2="88" y2="-58" stroke="#00ff41" stroke-width="2" filter="url(#radar-glow)"/>
    <!-- Blips -->
    <circle cx="55" cy="-35" r="3.5" fill="#ffffff" filter="url(#radar-glow)"/>
    <circle cx="-45" cy="40" r="2.5" fill="#00ff41" opacity="0.8"/>
    <circle cx="30" cy="65" r="3" fill="#00ff41" opacity="0.6"/>
  </g>
  <text x="35" y="35" fill="#00ff41" font-family="monospace" font-size="10" opacity="0.8">SONAR TACTICAL RANGE: 25NM</text>
  <text x="445" y="35" fill="#00ff41" font-family="monospace" font-size="10" opacity="0.8" text-anchor="end">STATUS: ACTIVE SWEEP</text>
</svg>