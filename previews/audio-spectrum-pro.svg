<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="pro-bg" cx="50%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#120524" stop-opacity="1"/>
      <stop offset="60%" stop-color="#070311" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020107" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="pro-bar-cyan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#7928ca" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="1"/>
    </linearGradient>
    <filter id="neon-glow-pro" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#pro-bg)"/>

  <!-- Psychoacoustic Studio Grid & DB Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.07)" stroke-width="0.8">
    <line x1="30" y1="50" x2="450" y2="50" stroke-dasharray="2,4"/>
    <line x1="30" y1="95" x2="450" y2="95" stroke-dasharray="2,4"/>
    <line x1="30" y1="140" x2="450" y2="140" stroke-dasharray="2,4"/>
    <line x1="30" y1="185" x2="450" y2="185" stroke-dasharray="2,4"/>
    <line x1="30" y1="230" x2="450" y2="230"/>
  </g>

  <!-- DB Labels on Left Margin -->
  <g fill="rgba(255, 255, 255, 0.35)" font-family="monospace" font-size="9" text-anchor="end">
    <text x="26" y="53">0dB</text>
    <text x="26" y="98">-6dB</text>
    <text x="26" y="143">-18dB</text>
    <text x="26" y="188">-36dB</text>
  </g>

  <!-- Bass Core Floor Bloom -->
  <ellipse cx="240" cy="235" rx="180" ry="40" fill="#00f2fe" opacity="0.14" filter="url(#neon-glow-pro)"/>
  <ellipse cx="240" cy="235" rx="110" ry="25" fill="#ff007f" opacity="0.18" filter="url(#neon-glow-pro)"/>

  <!-- Logarithmic Equalizer Bars (32 Mirrored Pairs) -->
  <g fill="url(#pro-bar-cyan)">
    <!-- Left Channel (Center to Left) -->
    <rect x="228" y="45" width="8" height="185" rx="2"/>
    <rect x="216" y="52" width="8" height="178" rx="2"/>
    <rect x="204" y="62" width="8" height="168" rx="2"/>
    <rect x="192" y="78" width="8" height="152" rx="2"/>
    <rect x="180" y="95" width="8" height="135" rx="2"/>
    <rect x="168" y="105" width="8" height="125" rx="2"/>
    <rect x="156" y="88" width="8" height="142" rx="2"/>
    <rect x="144" y="72" width="8" height="158" rx="2"/>
    <rect x="132" y="92" width="8" height="138" rx="2"/>
    <rect x="120" y="112" width="8" height="118" rx="2"/>
    <rect x="108" y="125" width="8" height="105" rx="2"/>
    <rect x="96" y="142" width="8" height="88" rx="2"/>
    <rect x="84" y="155" width="8" height="75" rx="2"/>
    <rect x="72" y="170" width="8" height="60" rx="2"/>
    <rect x="60" y="185" width="8" height="45" rx="2"/>
    <rect x="48" y="202" width="8" height="28" rx="2"/>
    <rect x="36" y="215" width="8" height="15" rx="2"/>

    <!-- Right Channel (Center to Right) -->
    <rect x="244" y="45" width="8" height="185" rx="2"/>
    <rect x="256" y="52" width="8" height="178" rx="2"/>
    <rect x="268" y="62" width="8" height="168" rx="2"/>
    <rect x="280" y="78" width="8" height="152" rx="2"/>
    <rect x="292" y="95" width="8" height="135" rx="2"/>
    <rect x="304" y="105" width="8" height="125" rx="2"/>
    <rect x="316" y="88" width="8" height="142" rx="2"/>
    <rect x="328" y="72" width="8" height="158" rx="2"/>
    <rect x="340" y="92" width="8" height="138" rx="2"/>
    <rect x="352" y="112" width="8" height="118" rx="2"/>
    <rect x="364" y="125" width="8" height="105" rx="2"/>
    <rect x="376" y="142" width="8" height="88" rx="2"/>
    <rect x="388" y="155" width="8" height="75" rx="2"/>
    <rect x="400" y="170" width="8" height="60" rx="2"/>
    <rect x="412" y="185" width="8" height="45" rx="2"/>
    <rect x="424" y="202" width="8" height="28" rx="2"/>
    <rect x="436" y="215" width="8" height="15" rx="2"/>
  </g>

  <!-- Pro Floating Peak Caps with Glow (Hovering peak holds) -->
  <g fill="#ffffff" filter="url(#neon-glow-pro)">
    <rect x="228" y="36" width="8" height="2.5" rx="1"/>
    <rect x="216" y="44" width="8" height="2.5" rx="1"/>
    <rect x="204" y="54" width="8" height="2.5" rx="1"/>
    <rect x="192" y="70" width="8" height="2.5" rx="1"/>
    <rect x="180" y="87" width="8" height="2.5" rx="1"/>
    <rect x="156" y="80" width="8" height="2.5" rx="1"/>
    <rect x="144" y="63" width="8" height="2.5" rx="1"/>
    <rect x="132" y="84" width="8" height="2.5" rx="1"/>
    <rect x="108" y="118" width="8" height="2.5" rx="1"/>
    <rect x="84" y="148" width="8" height="2.5" rx="1"/>
    <rect x="60" y="178" width="8" height="2.5" rx="1"/>

    <rect x="244" y="36" width="8" height="2.5" rx="1"/>
    <rect x="256" y="44" width="8" height="2.5" rx="1"/>
    <rect x="268" y="54" width="8" height="2.5" rx="1"/>
    <rect x="280" y="70" width="8" height="2.5" rx="1"/>
    <rect x="292" y="87" width="8" height="2.5" rx="1"/>
    <rect x="316" y="80" width="8" height="2.5" rx="1"/>
    <rect x="328" y="63" width="8" height="2.5" rx="1"/>
    <rect x="340" y="84" width="8" height="2.5" rx="1"/>
    <rect x="364" y="118" width="8" height="2.5" rx="1"/>
    <rect x="388" y="148" width="8" height="2.5" rx="1"/>
    <rect x="412" y="178" width="8" height="2.5" rx="1"/>
  </g>

  <!-- Bottom Frequency Scale Labels (Psychoacoustic Log Scale) -->
  <g fill="rgba(255, 255, 255, 0.45)" font-family="monospace" font-size="9" text-anchor="middle">
    <text x="48" y="248">16k</text>
    <text x="96" y="248">8k</text>
    <text x="144" y="248">2k</text>
    <text x="192" y="248">500</text>
    <text x="240" y="248">60Hz</text>
    <text x="288" y="248">500</text>
    <text x="336" y="248">2k</text>
    <text x="384" y="248">8k</text>
    <text x="432" y="248">16k</text>
  </g>

  <!-- PRO Status Badge in Top Right -->
  <g transform="translate(415, 20)">
    <rect x="-35" y="-10" width="55" height="18" rx="4" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1"/>
    <text x="-7" y="3" fill="#00f2fe" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PRO DSP</text>
  </g>
</svg>