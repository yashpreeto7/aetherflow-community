<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="tokyo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070014"/>
      <stop offset="45%" stop-color="#120228"/>
      <stop offset="80%" stop-color="#240742"/>
      <stop offset="100%" stop-color="#0d021c"/>
    </linearGradient>
    <linearGradient id="ground-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b400ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff007f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Night Sky -->
  <rect width="100%" height="100%" fill="url(#tokyo-sky)"/>

  <!-- Distant Background Towers & Fog -->
  <g fill="#100322" opacity="0.7">
    <rect x="40" y="80" width="45" height="190"/>
    <rect x="110" y="60" width="38" height="210"/>
    <rect x="180" y="95" width="50" height="175"/>
    <rect x="250" y="50" width="42" height="220"/>
    <rect x="330" y="75" width="48" height="195"/>
    <rect x="410" y="105" width="55" height="165"/>
  </g>

  <!-- Distant Tower Antennae & Lights -->
  <line x1="129" y1="42" x2="129" y2="60" stroke="#ff2d78" stroke-width="1.5" opacity="0.8"/>
  <circle cx="129" cy="42" r="2" fill="#ff2d78" filter="url(#neon-glow)"/>
  <line x1="271" y1="30" x2="271" y2="50" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="271" cy="30" r="2" fill="#00d4ff" filter="url(#neon-glow)"/>

  <!-- Midground City Skyline (Dark silhouette with glowing window matrices) -->
  <!-- Building 1 (Left Edge) -->
  <rect x="0" y="120" width="35" height="150" fill="#06010d"/>
  <g fill="#00d4ff" opacity="0.75">
    <rect x="6" y="132" width="4" height="6"/><rect x="15" y="132" width="4" height="6"/><rect x="24" y="132" width="4" height="6"/>
    <rect x="6" y="146" width="4" height="6"/><rect x="24" y="146" width="4" height="6"/>
    <rect x="15" y="160" width="4" height="6"/><rect x="24" y="160" width="4" height="6"/>
    <rect x="6" y="174" width="4" height="6"/><rect x="15" y="174" width="4" height="6"/>
  </g>

  <!-- Building 2 -->
  <rect x="38" y="105" width="52" height="165" fill="#05010a"/>
  <rect x="38" y="105" width="52" height="165" fill="none" stroke="#ff2d78" stroke-width="1" stroke-opacity="0.4"/>
  <g fill="#ff2d78" opacity="0.8">
    <rect x="46" y="118" width="5" height="7"/><rect x="58" y="118" width="5" height="7"/><rect x="70" y="118" width="5" height="7"/><rect x="78" y="118" width="5" height="7"/>
    <rect x="46" y="132" width="5" height="7"/><rect x="70" y="132" width="5" height="7"/>
    <rect x="46" y="146" width="5" height="7"/><rect x="58" y="146" width="5" height="7"/><rect x="78" y="146" width="5" height="7"/>
    <rect x="58" y="160" width="5" height="7"/><rect x="70" y="160" width="5" height="7"/>
    <rect x="46" y="174" width="5" height="7"/><rect x="58" y="174" width="5" height="7"/><rect x="78" y="174" width="5" height="7"/>
  </g>

  <!-- Building 3 (Tall Slender) -->
  <rect x="96" y="85" width="48" height="185" fill="#040008"/>
  <g fill="#ffcc00" opacity="0.85">
    <rect x="104" y="98" width="5" height="7"/><rect x="116" y="98" width="5" height="7"/><rect x="128" y="98" width="5" height="7"/>
    <rect x="104" y="112" width="5" height="7"/><rect x="128" y="112" width="5" height="7"/>
    <rect x="116" y="126" width="5" height="7"/><rect x="128" y="126" width="5" height="7"/>
    <rect x="104" y="140" width="5" height="7"/><rect x="116" y="140" width="5" height="7"/>
  </g>
  <!-- Cyberpunk Vertical Neon Sign -->
  <rect x="137" y="100" width="4" height="42" fill="#ff0055" filter="url(#neon-glow)"/>

  <!-- Building 4 (Center Skyscraper) -->
  <rect x="150" y="65" width="68" height="205" fill="#030006"/>
  <rect x="150" y="65" width="68" height="205" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Windows Matrix -->
  <g fill="#00f2fe" opacity="0.9">
    <rect x="160" y="80" width="6" height="8"/><rect x="174" y="80" width="6" height="8"/><rect x="188" y="80" width="6" height="8"/><rect x="202" y="80" width="6" height="8"/>
    <rect x="160" y="96" width="6" height="8"/><rect x="188" y="96" width="6" height="8"/>
    <rect x="174" y="112" width="6" height="8"/><rect x="188" y="112" width="6" height="8"/><rect x="202" y="112" width="6" height="8"/>
    <rect x="160" y="128" width="6" height="8"/><rect x="174" y="128" width="6" height="8"/><rect x="202" y="128" width="6" height="8"/>
    <rect x="174" y="144" width="6" height="8"/><rect x="188" y="144" width="6" height="8"/>
    <rect x="160" y="160" width="6" height="8"/><rect x="174" y="160" width="6" height="8"/><rect x="188" y="160" width="6" height="8"/>
  </g>

  <!-- Building 5 (Tokyo Tower Style Silhouette) -->
  <polygon points="234,70 248,15 262,70" fill="#ff0055" opacity="0.3"/>
  <line x1="248" y1="12" x2="248" y2="70" stroke="#ff2d78" stroke-width="2" filter="url(#neon-glow)"/>
  <circle cx="248" cy="12" r="3" fill="#ffffff" filter="url(#neon-glow)"/>
  <rect x="224" y="70" width="48" height="200" fill="#05010b"/>
  <g fill="#b400ff" opacity="0.85">
    <rect x="232" y="84" width="6" height="8"/><rect x="246" y="84" width="6" height="8"/><rect x="258" y="84" width="6" height="8"/>
    <rect x="232" y="100" width="6" height="8"/><rect x="258" y="100" width="6" height="8"/>
    <rect x="246" y="116" width="6" height="8"/><rect x="258" y="116" width="6" height="8"/>
    <rect x="232" y="132" width="6" height="8"/><rect x="246" y="132" width="6" height="8"/>
  </g>
  <!-- Rooftop Billboard -->
  <rect x="230" y="60" width="36" height="12" fill="#ff2d78" opacity="0.8" filter="url(#soft-glow)"/>

  <!-- Building 6 -->
  <rect x="278" y="90" width="58" height="180" fill="#040008"/>
  <g fill="#00d4ff" opacity="0.85">
    <rect x="288" y="106" width="6" height="8"/><rect x="302" y="106" width="6" height="8"/><rect x="316" y="106" width="6" height="8"/>
    <rect x="288" y="122" width="6" height="8"/><rect x="316" y="122" width="6" height="8"/>
    <rect x="302" y="138" width="6" height="8"/><rect x="316" y="138" width="6" height="8"/>
    <rect x="288" y="154" width="6" height="8"/><rect x="302" y="154" width="6" height="8"/><rect x="316" y="154" width="6" height="8"/>
  </g>

  <!-- Building 7 -->
  <rect x="342" y="110" width="60" height="160" fill="#06010e"/>
  <rect x="342" y="110" width="60" height="160" fill="none" stroke="#b400ff" stroke-width="1" stroke-opacity="0.45"/>
  <g fill="#ff007f" opacity="0.85">
    <rect x="352" y="125" width="6" height="8"/><rect x="366" y="125" width="6" height="8"/><rect x="380" y="125" width="6" height="8"/><rect x="392" y="125" width="6" height="8"/>
    <rect x="352" y="141" width="6" height="8"/><rect x="380" y="141" width="6" height="8"/>
    <rect x="366" y="157" width="6" height="8"/><rect x="380" y="157" width="6" height="8"/><rect x="392" y="157" width="6" height="8"/>
  </g>

  <!-- Building 8 (Right Edge) -->
  <rect x="408" y="80" width="72" height="190" fill="#040007"/>
  <g fill="#00ffcc" opacity="0.8">
    <rect x="420" y="98" width="6" height="8"/><rect x="434" y="98" width="6" height="8"/><rect x="448" y="98" width="6" height="8"/><rect x="462" y="98" width="6" height="8"/>
    <rect x="420" y="114" width="6" height="8"/><rect x="448" y="114" width="6" height="8"/><rect x="462" y="114" width="6" height="8"/>
    <rect x="434" y="130" width="6" height="8"/><rect x="448" y="130" width="6" height="8"/>
    <rect x="420" y="146" width="6" height="8"/><rect x="434" y="146" width="6" height="8"/><rect x="462" y="146" width="6" height="8"/>
  </g>

  <!-- Wet Street Reflection / Ground Bloom -->
  <rect x="0" y="215" width="480" height="55" fill="url(#ground-glow)"/>
  <line x1="0" y1="220" x2="480" y2="220" stroke="#00f2fe" stroke-width="0.8" opacity="0.3"/>

  <!-- Diagonal Falling Tokyo Rain Streaks (Multi-angled translucent rain) -->
  <g stroke="#96d2ff" stroke-width="1.2" opacity="0.5" stroke-linecap="round">
    <line x1="25" y1="15" x2="15" y2="45"/>
    <line x1="85" y1="35" x2="73" y2="72"/>
    <line x1="145" y1="10" x2="135" y2="42"/>
    <line x1="210" y1="28" x2="198" y2="65"/>
    <line x1="285" y1="8" x2="273" y2="45"/>
    <line x1="360" y1="25" x2="348" y2="60"/>
    <line x1="430" y1="12" x2="418" y2="48"/>

    <line x1="50" y1="75" x2="38" y2="115"/>
    <line x1="120" y1="85" x2="108" y2="125"/>
    <line x1="185" y1="65" x2="173" y2="105"/>
    <line x1="260" y1="78" x2="248" y2="118"/>
    <line x1="325" y1="82" x2="313" y2="120"/>
    <line x1="395" y1="68" x2="383" y2="106"/>
    <line x1="465" y1="85" x2="453" y2="122"/>

    <line x1="30" y1="140" x2="18" y2="180"/>
    <line x1="95" y1="155" x2="83" y2="192"/>
    <line x1="165" y1="135" x2="153" y2="175"/>
    <line x1="235" y1="145" x2="223" y2="185"/>
    <line x1="305" y1="138" x2="293" y2="178"/>
    <line x1="375" y1="150" x2="363" y2="188"/>
    <line x1="445" y1="142" x2="433" y2="180"/>

    <line x1="60" y1="205" x2="50" y2="242"/>
    <line x1="135" y1="198" x2="125" y2="235"/>
    <line x1="205" y1="210" x2="195" y2="248"/>
    <line x1="275" y1="202" x2="265" y2="240"/>
    <line x1="345" y1="212" x2="335" y2="250"/>
    <line x1="415" y1="200" x2="405" y2="238"/>
  </g>

  <!-- Puddle Splash Droplets on Ground -->
  <circle cx="50" cy="242" r="2.5" fill="none" stroke="#00f2fe" stroke-width="0.8" opacity="0.6"/>
  <circle cx="125" cy="235" r="3" fill="none" stroke="#ff2d78" stroke-width="0.8" opacity="0.6"/>
  <circle cx="265" cy="240" r="2.8" fill="none" stroke="#00f2fe" stroke-width="0.8" opacity="0.6"/>
  <circle cx="335" cy="250" r="3.2" fill="none" stroke="#b400ff" stroke-width="0.8" opacity="0.6"/>
  <circle cx="405" cy="238" r="2.5" fill="none" stroke="#ffcc00" stroke-width="0.8" opacity="0.6"/>
</svg>