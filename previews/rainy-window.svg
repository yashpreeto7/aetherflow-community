<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="rain-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0c1726"/><stop offset="100%" stop-color="#03070d"/>
    </radialGradient>
    <filter id="bokeh-blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#rain-bg)"/>
  <!-- Blurred City Bokeh Orbs -->
  <circle cx="120" cy="90" r="45" fill="#f59e0b" opacity="0.25" filter="url(#bokeh-blur)"/>
  <circle cx="340" cy="150" r="60" fill="#ef4444" opacity="0.2" filter="url(#bokeh-blur)"/>
  <circle cx="250" cy="70" r="35" fill="#38bdf8" opacity="0.2" filter="url(#bokeh-blur)"/>
  <!-- Rain Water Runnels -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M 90 20 Q 92 80 88 120 T 90 220"/>
    <path d="M 220 10 Q 218 60 222 110 T 220 190"/>
    <path d="M 370 30 Q 372 90 368 150 T 370 250"/>
  </g>
  <!-- Translucent Rain Droplets -->
  <g fill="#e2e8f0" opacity="0.85">
    <ellipse cx="90" cy="225" rx="4" ry="6"/>
    <ellipse cx="220" cy="195" rx="3.5" ry="5"/>
    <ellipse cx="370" cy="255" rx="4" ry="6"/>
    <circle cx="150" cy="80" r="2.5"/><circle cx="170" cy="140" r="2"/><circle cx="300" cy="60" r="3"/>
    <circle cx="280" cy="210" r="2.5"/><circle cx="420" cy="120" r="3"/><circle cx="50" cy="160" r="2"/>
  </g>
</svg>