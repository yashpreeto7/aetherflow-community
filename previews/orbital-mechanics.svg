<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="orbit-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#031326"/><stop offset="60%" stop-color="#010712"/><stop offset="100%" stop-color="#000308"/>
    </radialGradient>
    <filter id="orbit-glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#orbit-bg)"/>
  <!-- Central Sun -->
  <circle cx="240" cy="135" r="14" fill="#fbbf24" filter="url(#orbit-glow)"/>
  <!-- Elliptical Orbits -->
  <g stroke="#38bdf8" fill="none" opacity="0.4" stroke-width="1.2">
    <ellipse cx="240" cy="135" rx="60" ry="32"/>
    <ellipse cx="240" cy="135" rx="110" ry="58"/>
    <ellipse cx="240" cy="135" rx="160" ry="85"/>
  </g>
  <!-- Planets -->
  <circle cx="285" cy="120" r="4" fill="#38bdf8" filter="url(#orbit-glow)"/>
  <circle cx="160" cy="170" r="6" fill="#f43f5e" filter="url(#orbit-glow)"/>
  <circle cx="360" cy="90" r="7" fill="#a855f7" filter="url(#orbit-glow)"/>
</svg>