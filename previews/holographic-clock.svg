<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="holo-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#031f28"/>
      <stop offset="60%" stop-color="#021017"/>
      <stop offset="100%" stop-color="#01060a"/>
    </radialGradient>
    <filter id="cyan-glow">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#holo-bg)"/>
  <!-- Circular Rings -->
  <g transform="translate(240, 135)" stroke="#00f0ff" fill="none" filter="url(#cyan-glow)">
    <circle r="95" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
    <circle r="85" stroke-width="2" stroke-dasharray="140,20,50,15"/>
    <circle r="72" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.6"/>
    <circle r="58" stroke-width="1" opacity="0.3"/>
    <!-- Compass Degree Marks -->
    <line x1="0" y1="-95" x2="0" y2="-85" stroke-width="2"/>
    <line x1="95" y1="0" x2="85" y2="0" stroke-width="2"/>
    <line x1="0" y1="95" x2="0" y2="85" stroke-width="2"/>
    <line x1="-95" y1="0" x2="-85" y2="0" stroke-width="2"/>
    <!-- Clock Hands -->
    <line x1="0" y1="0" x2="35" y2="-45" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-45" y2="-15" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="50" stroke="#ff0055" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#ff0055"/>
  </g>
  <!-- Digital Readouts -->
  <text x="240" y="215" fill="#00f0ff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3" filter="url(#cyan-glow)">23:58:42 UTC</text>
  <text x="70" y="45" fill="#00f0ff" font-family="monospace" font-size="9" opacity="0.6">SYS.CHRONO // V.2.4</text>
  <text x="410" y="45" fill="#00f0ff" font-family="monospace" font-size="9" opacity="0.6" text-anchor="end">LOC: 35.6762° N</text>
</svg>