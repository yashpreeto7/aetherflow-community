<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="aurora-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#01060e"/>
      <stop offset="40%" stop-color="#020f18"/>
      <stop offset="75%" stop-color="#041824"/>
      <stop offset="100%" stop-color="#010810"/>
    </linearGradient>
    <linearGradient id="aurora-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#00ffb3" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="aurora-violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="water-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffb3" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#02252a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#010810" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="aurora-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Night Arctic Sky -->
  <rect width="100%" height="100%" fill="url(#aurora-sky)"/>

  <!-- Starfield -->
  <g fill="#ffffff">
    <circle cx="28" cy="24" r="1" opacity="0.8"/>
    <circle cx="56" cy="48" r="0.8" opacity="0.6"/>
    <circle cx="92" cy="18" r="1.4" opacity="0.9"/>
    <circle cx="134" cy="38" r="0.7" opacity="0.5"/>
    <circle cx="178" cy="22" r="1.2" opacity="0.85"/>
    <circle cx="215" cy="45" r="0.9" opacity="0.7"/>
    <circle cx="264" cy="16" r="1.5" opacity="0.95"/>
    <circle cx="308" cy="32" r="0.8" opacity="0.6"/>
    <circle cx="342" cy="14" r="1.3" opacity="0.85"/>
    <circle cx="388" cy="42" r="0.7" opacity="0.55"/>
    <circle cx="426" cy="26" r="1.2" opacity="0.8"/>
    <circle cx="462" cy="36" r="1" opacity="0.75"/>
    <circle cx="75" cy="62" r="0.8" opacity="0.5"/>
    <circle cx="160" cy="58" r="1.1" opacity="0.7"/>
    <circle cx="245" cy="55" r="0.9" opacity="0.6"/>
    <circle cx="370" cy="60" r="1.3" opacity="0.8"/>
    <circle cx="445" cy="52" r="0.7" opacity="0.5"/>
  </g>

  <!-- Big Bright Northern Star -->
  <circle cx="342" cy="14" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="342" cy="14" r="1.8" fill="#e0f7ff"/>

  <!-- Top Violet Aurora Curtain -->
  <path d="M-20,95 Q80,45 180,75 T360,60 T500,85 L500,165 Q370,130 260,150 T80,135 T-20,160 Z"
        fill="url(#aurora-violet)" filter="url(#aurora-blur)" opacity="0.8"/>

  <!-- Main Neon Emerald Aurora Curtain (Wavy dancing ribbon) -->
  <path d="M-20,120 Q70,55 170,95 T350,75 T500,105 L500,195 Q380,150 270,175 T90,160 T-20,185 Z"
        fill="url(#aurora-green)" filter="url(#aurora-blur)"/>

  <!-- Secondary Bright Core Ribbon (Vibrant Emerald / Cyan) -->
  <path d="M-10,135 Q90,75 200,115 T380,95 T490,120"
        fill="none" stroke="#00ff88" stroke-width="4.5" opacity="0.75" filter="url(#aurora-blur)"/>
  <path d="M-10,135 Q90,75 200,115 T380,95 T490,120"
        fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Subtle Vertical Light Ray Pillars -->
  <g stroke="#00ffb3" stroke-width="1" opacity="0.35" filter="url(#aurora-blur)">
    <line x1="85" y1="50" x2="85" y2="155"/>
    <line x1="120" y1="62" x2="120" y2="165"/>
    <line x1="165" y1="45" x2="165" y2="160"/>
    <line x1="210" y1="58" x2="210" y2="170"/>
    <line x1="260" y1="48" x2="260" y2="165"/>
    <line x1="315" y1="65" x2="315" y2="172"/>
    <line x1="375" y1="55" x2="375" y2="168"/>
    <line x1="420" y1="70" x2="420" y2="165"/>
  </g>

  <!-- Distant Snowy Mountain Silhouette -->
  <polygon points="0,215 55,178 110,210 165,165 230,212 305,170 380,210 440,182 480,205 480,225 0,225"
           fill="#030b13"/>
  <!-- Mountain Snow Highlights -->
  <polyline points="155,172 165,165 178,175" fill="none" stroke="#00ffb3" stroke-width="1.2" opacity="0.3"/>
  <polyline points="295,178 305,170 318,180" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.3"/>

  <!-- Pine Tree Ridge Silhouette -->
  <g fill="#01060b">
    <!-- Tree cluster left -->
    <polygon points="12,225 18,198 24,225"/>
    <polygon points="22,225 28,192 34,225"/>
    <polygon points="32,225 37,202 42,225"/>
    <polygon points="46,225 52,195 58,225"/>
    <polygon points="62,225 68,205 74,225"/>
    <!-- Center trees -->
    <polygon points="190,225 195,200 200,225"/>
    <polygon points="204,225 210,192 216,225"/>
    <polygon points="220,225 225,204 230,225"/>
    <!-- Right trees -->
    <polygon points="410,225 416,196 422,225"/>
    <polygon points="426,225 432,190 438,225"/>
    <polygon points="442,225 448,200 454,225"/>
    <polygon points="458,225 464,194 470,225"/>
  </g>

  <!-- Reflective Arctic Lake Shoreline & Water -->
  <rect x="0" y="222" width="480" height="48" fill="url(#water-glow)"/>
  <line x1="0" y1="222" x2="480" y2="222" stroke="#00ffb3" stroke-width="0.8" opacity="0.45"/>

  <!-- Water Ripple Aurora Reflections -->
  <g stroke="#00ffb3" stroke-width="1.2" opacity="0.5" stroke-linecap="round">
    <line x1="60" y1="228" x2="140" y2="228"/>
    <line x1="170" y1="233" x2="280" y2="233"/>
    <line x1="90" y1="238" x2="190" y2="238"/>
    <line x1="230" y1="242" x2="350" y2="242"/>
    <line x1="120" y1="248" x2="260" y2="248"/>
    <line x1="290" y1="252" x2="410" y2="252"/>
    <line x1="160" y1="258" x2="330" y2="258"/>
    <line x1="220" y1="264" x2="380" y2="264"/>
  </g>
</svg>