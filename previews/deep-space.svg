<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="nebula-1" cx="35%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#701a75" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-3" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Black Void -->
  <rect width="100%" height="100%" fill="#03040c"/>

  <!-- Swirling Nebula Clouds -->
  <rect width="100%" height="100%" fill="url(#nebula-1)"/>
  <rect width="100%" height="100%" fill="url(#nebula-2)"/>
  <rect width="100%" height="100%" fill="url(#nebula-3)"/>

  <!-- Background Tiny Star Dust -->
  <g fill="#ffffff">
    <circle cx="45" cy="30" r="0.8" opacity="0.6"/>
    <circle cx="85" cy="85" r="0.7" opacity="0.5"/>
    <circle cx="120" cy="45" r="1.1" opacity="0.8"/>
    <circle cx="160" cy="95" r="0.9" opacity="0.7"/>
    <circle cx="210" cy="35" r="0.6" opacity="0.4"/>
    <circle cx="270" cy="75" r="1.0" opacity="0.7"/>
    <circle cx="310" cy="30" r="0.8" opacity="0.6"/>
    <circle cx="360" cy="80" r="0.7" opacity="0.5"/>
    <circle cx="410" cy="40" r="1.2" opacity="0.85"/>
    <circle cx="445" cy="90" r="0.6" opacity="0.5"/>
    
    <circle cx="30" cy="140" r="0.7" opacity="0.5"/>
    <circle cx="75" cy="180" r="1.0" opacity="0.7"/>
    <circle cx="115" cy="130" r="0.8" opacity="0.6"/>
    <circle cx="150" cy="220" r="0.9" opacity="0.7"/>
    <circle cx="225" cy="160" r="0.7" opacity="0.5"/>
    <circle cx="285" cy="210" r="1.1" opacity="0.8"/>
    <circle cx="340" cy="150" r="0.8" opacity="0.6"/>
    <circle cx="395" cy="190" r="0.9" opacity="0.7"/>
    <circle cx="450" cy="160" r="0.7" opacity="0.5"/>

    <circle cx="60" cy="240" r="0.8" opacity="0.6"/>
    <circle cx="180" cy="250" r="0.7" opacity="0.5"/>
    <circle cx="240" cy="235" r="1.0" opacity="0.75"/>
    <circle cx="330" cy="245" r="0.8" opacity="0.6"/>
    <circle cx="420" cy="230" r="0.7" opacity="0.5"/>
  </g>

  <!-- Shooting Star Streak -->
  <line x1="380" y1="20" x2="310" y2="60" stroke="#ffffff" stroke-width="1.4" opacity="0.8" stroke-linecap="round"/>
  <line x1="380" y1="20" x2="335" y2="45" stroke="#a855f7" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Foreground Bright Twinkling Stars with 4-Point Diffraction Crosses -->
  <g filter="url(#star-glow)">
    <!-- Star Alpha (Left-Center) -->
    <path d="M140 70 L140 60 M140 70 L140 80 M140 70 L130 70 M140 70 L150 70" stroke="#c084fc" stroke-width="1"/>
    <circle cx="140" cy="70" r="2.2" fill="#ffffff"/>

    <!-- Star Beta (Top-Right) -->
    <path d="M370 50 L370 42 M370 50 L370 58 M370 50 L362 50 M370 50 L378 50" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="370" cy="50" r="2.5" fill="#ffffff"/>

    <!-- Star Gamma (Bottom-Center) -->
    <path d="M260 170 L260 162 M260 170 L260 178 M260 170 L252 170 M260 170 L268 170" stroke="#f472b6" stroke-width="1"/>
    <circle cx="260" cy="170" r="2.2" fill="#ffffff"/>

    <!-- Star Delta (Far Left) -->
    <circle cx="65" cy="110" r="2.0" fill="#e0e7ff"/>
    <!-- Star Epsilon (Far Right) -->
    <circle cx="430" cy="120" r="2.0" fill="#e0e7ff"/>
  </g>
</svg>