<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="twilight-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18042b"/><stop offset="65%" stop-color="#580f48"/><stop offset="100%" stop-color="#ff4b5c"/>
    </linearGradient>
    <linearGradient id="synth-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffea00"/><stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="150" fill="url(#twilight-sky)"/>
  <!-- Striped Sun -->
  <g transform="translate(240, 150)">
    <circle cx="0" cy="0" r="65" fill="url(#synth-sun)"/>
    <!-- Cutout scanlines -->
    <rect x="-70" y="-40" width="140" height="4" fill="#30072d"/>
    <rect x="-70" y="-28" width="140" height="6" fill="#30072d"/>
    <rect x="-70" y="-14" width="140" height="8" fill="#30072d"/>
    <rect x="-70" y="2" width="140" height="10" fill="#30072d"/>
  </g>
  <!-- Ocean Grid Base -->
  <rect x="0" y="150" width="480" height="120" fill="#0d0117"/>
  <!-- Reflective Ocean Grid Lines -->
  <g stroke="#ff007f" stroke-width="1.5" opacity="0.8">
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="175" x2="480" y2="175"/>
    <line x1="0" y1="195" x2="480" y2="195"/>
    <line x1="0" y1="225" x2="480" y2="225"/>
    <line x1="0" y1="265" x2="480" y2="265"/>
    <!-- Perspective radial lines -->
    <line x1="240" y1="150" x2="0" y2="270"/>
    <line x1="240" y1="150" x2="120" y2="270"/>
    <line x1="240" y1="150" x2="240" y2="270"/>
    <line x1="240" y1="150" x2="360" y2="270"/>
    <line x1="240" y1="150" x2="480" y2="270"/>
  </g>
</svg>