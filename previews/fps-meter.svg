<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="hud-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#081522" stop-opacity="1"/>
      <stop offset="60%" stop-color="#03080e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#010306" stop-opacity="1"/>
    </radialGradient>
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tech Radial Backdrop -->
  <rect width="100%" height="100%" fill="url(#hud-bg)"/>

  <!-- Cyberpunk Matrix Background Grid -->
  <g stroke="rgba(0, 255, 204, 0.08)" stroke-width="1">
    <line x1="0" y1="45" x2="480" y2="45"/><line x1="0" y1="90" x2="480" y2="90"/><line x1="0" y1="135" x2="480" y2="135"/><line x1="0" y1="180" x2="480" y2="180"/><line x1="0" y1="225" x2="480" y2="225"/>
    <line x1="60" y1="0" x2="60" y2="270"/><line x1="120" y1="0" x2="120" y2="270"/><line x1="180" y1="0" x2="180" y2="270"/><line x1="240" y1="0" x2="240" y2="270"/><line x1="300" y1="0" x2="300" y2="270"/><line x1="360" y1="0" x2="360" y2="270"/><line x1="420" y1="0" x2="420" y2="270"/>
  </g>

  <!-- Floating Telemetry Spark Nodes -->
  <g fill="#00ffcc" opacity="0.65">
    <circle cx="85" cy="55" r="1.5"/><circle cx="140" cy="80" r="1.2"/><circle cx="70" cy="210" r="1.5"/>
    <circle cx="410" cy="65" r="1.5"/><circle cx="370" cy="190" r="1.2"/><circle cx="430" cy="220" r="1.4"/>
  </g>

  <!-- HUD Corner Brackets -->
  <g stroke="#00ffcc" stroke-width="1.5" opacity="0.6">
    <polyline points="15,25 15,15 25,15"/>
    <polyline points="465,25 465,15 455,15"/>
    <polyline points="15,245 15,255 25,255"/>
    <polyline points="465,245 465,255 455,255"/>
  </g>

  <!-- Telemetry Header Badges (Left & Right) -->
  <g font-family="monospace" font-size="9.5" fill="#00ffcc" opacity="0.85">
    <text x="32" y="24">SYS.TELEMETRY // LIVE</text>
    <text x="448" y="24" text-anchor="end">D3D12 // 165Hz G-SYNC</text>
  </g>

  <!-- Center Circular Tachometer / Gauge -->
  <!-- Outer Dashed Cyan Tech Ring -->
  <circle cx="240" cy="115" r="76" fill="none" stroke="#00ffcc" stroke-width="1.8" stroke-dasharray="14,10" filter="url(#hud-glow)"/>
  <!-- Secondary Counter-Ring (Accent Magenta) -->
  <circle cx="240" cy="115" r="66" fill="none" stroke="#ff0055" stroke-width="1.2" stroke-dasharray="4,12,8,8"/>
  <!-- Background Arc -->
  <path d="M180,145 A70,70 0 1,1 300,145" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="7" stroke-linecap="round"/>
  <!-- Active Green Gauge Arc (High Performance) -->
  <path d="M180,145 A70,70 0 1,1 292,125" fill="none" stroke="#00ffcc" stroke-width="7" stroke-linecap="round" filter="url(#hud-glow)"/>

  <!-- Center Big FPS Counter Readout -->
  <g font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="240" y="112" fill="#ffffff" font-size="36" font-weight="900" letter-spacing="-1px" filter="url(#hud-glow)">165</text>
    <text x="240" y="128" fill="#00ffcc" font-size="11" font-weight="700" letter-spacing="3px">FPS</text>
    <text x="240" y="144" fill="#a7f3d0" font-size="9" font-family="monospace">STABLE // 100%</text>
  </g>

  <!-- Center Gauge Tick Marks -->
  <g stroke="rgba(0,255,204,0.4)" stroke-width="1.5">
    <line x1="240" y1="36" x2="240" y2="42"/>
    <line x1="165" y1="115" x2="171" y2="115"/>
    <line x1="309" y1="115" x2="315" y2="115"/>
  </g>

  <!-- Oscilloscope Frame-Time Graph Window (Bottom Half) -->
  <g transform="translate(100, 185)">
    <!-- Frame-time Graph Card -->
    <rect x="0" y="0" width="280" height="58" rx="6" fill="rgba(6, 17, 28, 0.85)" stroke="rgba(0, 255, 204, 0.3)" stroke-width="1"/>

    <!-- Graph Header -->
    <text x="10" y="14" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8.5" font-weight="bold">FRAME TIME GRAPH</text>
    <text x="270" y="14" fill="#00ffcc" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="end">6.06 ms</text>

    <!-- Internal Reference Grid Lines -->
    <line x1="10" y1="24" x2="270" y2="24" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" stroke-dasharray="2,3"/>
    <line x1="10" y1="38" x2="270" y2="38" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" stroke-dasharray="2,3"/>

    <!-- Frame-Time Waveform Polyline (Smooth ultra-flat 6.06ms frame pacing) -->
    <polyline points="
      10,38 25,37 40,38 55,38 70,37 85,39 100,38 115,38 130,37 145,38 160,37 175,38 190,38 205,37 220,38 235,37 250,38 270,38
    " fill="none" stroke="#00ffcc" stroke-width="1.8" filter="url(#hud-glow)"/>

    <!-- Tiny occasional spike -->
    <polyline points="158,37 163,31 168,38" fill="none" stroke="#ff0055" stroke-width="1.5"/>

    <!-- Bottom Metrics -->
    <g font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">
      <text x="10" y="52">0.1% LOW: 154 FPS</text>
      <text x="100" y="52">AVG: 164.8 FPS</text>
      <text x="270" y="52" text-anchor="end">GPU LOAD: 88%</text>
    </g>
  </g>
</svg>
