<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <radialGradient id="pcb-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#021c17"/>
      <stop offset="60%" stop-color="#010f0c"/>
      <stop offset="100%" stop-color="#000705"/>
    </radialGradient>
    <filter id="pcb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#pcb-bg)"/>
  <!-- Microchip Core -->
  <rect x="200" y="95" width="80" height="80" rx="6" fill="#03251e" stroke="#00ffcc" stroke-width="2"/>
  <rect x="215" y="110" width="50" height="50" rx="3" fill="#003d32" stroke="#00ffcc" stroke-width="1"/>
  <text x="240" y="140" fill="#00ffcc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">CPU-HEX</text>
  <!-- PCB Circuit Traces -->
  <g stroke="#00ffcc" stroke-width="2" fill="none" opacity="0.85" filter="url(#pcb-glow)">
    <!-- Top bus -->
    <path d="M 215 95 L 215 50 L 150 50 L 120 20"/>
    <path d="M 240 95 L 240 30"/>
    <path d="M 265 95 L 265 50 L 330 50 L 360 20"/>
    <!-- Bottom bus -->
    <path d="M 215 175 L 215 220 L 140 220 L 110 250"/>
    <path d="M 240 175 L 240 240"/>
    <path d="M 265 175 L 265 220 L 340 220 L 370 250"/>
    <!-- Left bus -->
    <path d="M 200 115 L 140 115 L 100 80 L 40 80"/>
    <path d="M 200 135 L 120 135 L 70 170 L 20 170"/>
    <path d="M 200 155 L 150 155 L 110 190"/>
    <!-- Right bus -->
    <path d="M 280 115 L 340 115 L 380 80 L 440 80"/>
    <path d="M 280 135 L 360 135 L 410 170 L 460 170"/>
    <path d="M 280 155 L 330 155 L 370 190"/>
  </g>
  <!-- Solder Vias and Contact Pads -->
  <g fill="#ffea00" stroke="#00ffcc" stroke-width="1.5">
    <circle cx="120" cy="20" r="4"/><circle cx="240" cy="30" r="4"/><circle cx="360" cy="20" r="4"/>
    <circle cx="110" cy="250" r="4"/><circle cx="240" cy="240" r="4"/><circle cx="370" cy="250" r="4"/>
    <circle cx="40" cy="80" r="4"/><circle cx="20" cy="170" r="4"/><circle cx="440" cy="80" r="4"/><circle cx="460" cy="170" r="4"/>
    <circle cx="100" cy="80" r="3" fill="#00ffcc"/><circle cx="380" cy="80" r="3" fill="#00ffcc"/>
    <circle cx="70" cy="170" r="3" fill="#00ffcc"/><circle cx="410" cy="170" r="3" fill="#00ffcc"/>
  </g>
</svg>